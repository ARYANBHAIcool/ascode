<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>⚡ FanCode Live Player • AryanStreams</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; background:#000; overflow:hidden; }
        #player-container {
            position:fixed; inset:0;
            display:flex; align-items:center; justify-content:center;
            background:#000;
        }
        video { width:100%; height:100%; object-fit:contain; background:#000; }
        .shaka-spinner-container,.shaka-spinner,.shaka-spinner-svg { display:none!important; }
        #back-btn {
            position:fixed; top:12px; left:12px; z-index:9999;
            background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.15);
            color:rgba(255,255,255,0.9); padding:6px 14px; border-radius:8px;
            font-size:12px; font-weight:600; cursor:pointer;
            text-decoration:none; backdrop-filter:blur(8px); transition:0.2s;
        }
        #back-btn:hover { background:rgba(0,0,0,0.8); color:#fff; }
        #loading {
            position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            background:#000; z-index:100; transition:opacity 0.3s;
        }
        #loading.hidden { opacity:0; pointer-events:none; }
        .spinner { width:44px; height:44px; border:3px solid rgba(255,255,255,0.1);
            border-top-color:#6366f1; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        #error-msg {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            background:rgba(239,68,68,0.9); color:#fff; padding:8px 18px;
            border-radius:8px; font-size:13px; font-family:sans-serif;
            display:none; z-index:200;
        }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div></div>
    <a href="index.html" id="back-btn">← Back</a>
    <div id="player-container">
        <video id="video" playsinline webkit-playsinline autoplay></video>
    </div>
    <div id="error-msg"></div>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>
    <script>
    (function() {
        var params = new URLSearchParams(location.search || location.hash.replace('#',''));
        function cleanStreamUrl(value) {
            return String(value || "").trim().split("|")[0].trim().replace(/[,\s]+$/g, "");
        }

        var PROXIES = [
            "https://asp1.lovable.app/api/proxy?u=",
            "https://stream-through-spark.lovable.app/api/proxy?u="
        ];
        var currentProxyIdx = 0;

        function toProxiedUrl(u, pIdx) {
            if (!u) return "";
            var clean = cleanStreamUrl(u);
            if (clean.indexOf("lovable.app") !== -1 || clean.indexOf("/api/proxy") !== -1) return clean;
            var px = PROXIES[typeof pIdx === 'number' ? pIdx : currentProxyIdx] || PROXIES[0];
            return px + encodeURIComponent(clean);
        }

        function cleanKey(k) {
            if (!k) return '';
            var s = String(k).trim().toLowerCase().replace(/-/g, '');
            if (s.length === 32) return s;
            try {
                var b64 = k.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var bin = atob(b64);
                var hex = '';
                for (var i = 0; i < bin.length; i++) {
                    var h = bin.charCodeAt(i).toString(16);
                    hex += (h.length === 1 ? '0' : '') + h;
                }
                return hex;
            } catch(e) {
                return s;
            }
        }

        var rawMpd = cleanStreamUrl(params.get('mpd') || params.get('url') || '');
        var KEY_ID  = cleanKey(params.get('kid') || '');
        var KEY     = cleanKey(params.get('key') || '');
        var REFERER = params.get('referer') || 'https://fancode.com/';

        var $video   = document.getElementById('video');
        var $loading = document.getElementById('loading');
        var $error   = document.getElementById('error-msg');

        function showError(msg) {
            $error.textContent = msg;
            $error.style.display = 'block';
            setTimeout(function(){ $error.style.display = 'none'; }, 6000);
        }
        function hideLoading() {
            $loading.classList.add('hidden');
            setTimeout(function(){ $loading.style.display = 'none'; }, 350);
        }

        if (!rawMpd) {
            hideLoading();
            showError('No MPD URL provided.');
            return;
        }

        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            hideLoading();
            showError('Browser not supported for DASH playback.');
            return;
        }

        var baseMpdUrl = rawMpd.substring(0, rawMpd.lastIndexOf('/') + 1);
        var MPD_URL = toProxiedUrl(rawMpd, currentProxyIdx);

        var player = new shaka.Player();
        player.attach($video).then(function() {
            var ui = new shaka.ui.Overlay(player, document.getElementById('player-container'), $video);
            ui.configure({
                controlPanelElements: ['play_pause','mute','volume','spacer','time_and_duration','spacer','quality','picture_in_picture','fullscreen'],
                seekBarColors: { base:'#555', buffered:'#888', played:'#6366f1' }
            });

            player.getNetworkingEngine().registerRequestFilter(function(type, req) {
                req.uris = req.uris.map(function(u) {
                    if (u.indexOf('asp1.lovable.app/api/proxy?u=') !== -1 || u.indexOf('stream-through-spark.lovable.app/api/proxy?u=') !== -1) {
                        return u;
                    }
                    if (u.indexOf('lovable.app/api/') !== -1 || u.indexOf('ascode.pages.dev/') !== -1 || u.indexOf('localhost') !== -1) {
                        var filename = u.substring(u.lastIndexOf('/') + 1);
                        if (baseMpdUrl) {
                            return toProxiedUrl(baseMpdUrl + filename, currentProxyIdx);
                        }
                    }
                    if (u.indexOf('fancode.com') !== -1 && u.indexOf('proxy') === -1) {
                        return toProxiedUrl(u, currentProxyIdx);
                    }
                    return u;
                });
            });

            var config = {
                manifest: { defaultPresentationDelay:4, dash:{autoCorrectDrift:true, ignoreMinBufferTime:true}, retryParameters:{baseDelay:100} },
                streaming: { bufferingGoal:8, rebufferingGoal:1.5, bufferBehind:20, retryParameters:{baseDelay:100, maxAttempts:5} },
                abr: { enabled:true, defaultBandwidthEstimate:1500000, restrictions:{maxHeight:1080} }
            };
            if (KEY_ID && KEY) {
                config.drm = { clearKeys:{} };
                config.drm.clearKeys[KEY_ID] = KEY;
            }
            player.configure(config);

            function startLoad() {
                player.load(MPD_URL).then(function() {
                    $video.muted = true;
                    $video.play().catch(function(){});
                }).catch(function(e) {
                    console.error('Load error:', e);
                    if (currentProxyIdx < PROXIES.length - 1) {
                        currentProxyIdx++;
                        MPD_URL = toProxiedUrl(rawMpd, currentProxyIdx);
                        startLoad();
                    } else {
                        showError('Stream load failed – retrying...');
                        setTimeout(function(){ location.reload(); }, 5000);
                    }
                });
            }

            startLoad();

            $video.addEventListener('playing', hideLoading);
            $video.addEventListener('canplay', hideLoading);

            player.addEventListener('error', function(ev) {
                var err = ev.detail;
                if (err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
                showError('Playback error – retrying...');
                setTimeout(function(){ startLoad(); }, 5000);
            });

            document.addEventListener('click', function unmute() {
                $video.muted = false;
                document.removeEventListener('click', unmute);
            }, { once: true });
        });
    })();
    </script>
</body>
</html>
