<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>FanCode Live | Stream Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(239, 68, 68, 0.15), transparent 30rem),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.12), transparent 30rem),
                #090d16;
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .glass-nav {
            background: rgba(9, 13, 22, 0.76);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .match-card {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card:hover {
            transform: translateY(-4px);
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

        body.modal-open { overflow: hidden; }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            outline: none;
            border: none;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
    (function() {
        const M3U_API = "https://raw.githubusercontent.com/ARYANBHAIcool/ascode/main/data/fancode.m3u";
        const JSON_API = "https://raw.githubusercontent.com/ARYANBHAIcool/ascode/main/data/fancode.json";
        const BACKUP_M3U_API = "https://raw.githubusercontent.com/doctor-8trange/zyphx8/refs/heads/main/data/fancode.m3u";
        const BACKUP_JSON_API = "https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.json";
        const FALLBACK_IMG = "https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg";
        let allMatches = [], currentFilter = "ALL", currentMatch = null, currentQuality = null;
        let selectedStreamUrl = "", selectedRawUrl = "", hlsInstance = null;

        function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

        function cleanStreamUrl(value) {
            return String(value || "").trim().split("|")[0].trim().replace(/[,\s]+$/g, "");
        }

        function dedup(arr) {
            const seen = new Set();
            return arr.filter(m => { 
                const baseId = String(m.match_id || "").split("_")[0].toLowerCase();
                const k = baseId + "_" + (m.language || ""); 
                if(seen.has(k)) return false; 
                seen.add(k); 
                return true; 
            });
        }

        function findMatchById(id) {
            if (!id) return null;
            const target = String(id).trim().toLowerCase();
            const targetBase = target.split("_")[0];
            const exact = allMatches.find(m => String(m.match_id || "").trim().toLowerCase() === target);
            if (exact) return exact;
            return allMatches.find(m => {
                const cur = String(m.match_id || "").trim().toLowerCase();
                const curBase = cur.split("_")[0];
                return curBase === targetBase;
            });
        }

        function decodeHex(hex) {
            if (!hex) return "";
            let str = "";
            for (let i = 0; i < hex.length; i += 2) {
                str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
            }
            return str;
        }

        function hasStream(m) {
            return Boolean(m.dai_url || m.adfree_url || m.stream_url || m.google_m3u8_hex || m.m3u8_hex || (m.STREAMING_CDN && m.STREAMING_CDN.Primary_Playback_URL));
        }

        function extractM3u8Qualities(text, baseStream) {
            if (!text) return [];
            const lines = text.split("\n");
            const qualities = [];
            const seen = new Set();
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes("RESOLUTION=")) {
                    const resPart = lines[i].split("RESOLUTION=")[1].split(",")[0];
                    const height = resPart.split("x")[1];
                    let nextLine = "";
                    for (let j = i + 1; j < lines.length; j++) {
                        const candidate = lines[j].trim();
                        if (candidate && !candidate.startsWith("#")) {
                            nextLine = candidate;
                            break;
                        }
                    }
                    let streamUrl = cleanStreamUrl(nextLine);
                    if (streamUrl && !streamUrl.startsWith("http") && baseStream) {
                        try {
                            const baseUrl = new URL(baseStream);
                            const pathDir = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf("/") + 1);
                            streamUrl = baseUrl.origin + pathDir + streamUrl;
                        } catch (_) {}
                    }
                    const resLabel = height + "p";
                    if (streamUrl && streamUrl.startsWith("http") && !seen.has(resLabel)) {
                        seen.add(resLabel);
                        qualities.push({ res: resLabel, url: streamUrl, isHd: parseInt(height) >= 720, targetRes: resLabel });
                    }
                }
            }
            return qualities;
        }

        function isUrlNotExpired(url) {
            const m = String(url || "").match(/Expires=(\d+)/i);
            if (!m) return true;
            const exp = parseInt(m[1], 10);
            return !exp || (exp * 1000 > Date.now() + 60000);
        }

        // Parsing stream qualities and resolutions
        function parseQualities(m) {
            const standardRes = ["1080p", "720p", "540p", "480p", "360p", "240p"];
            const baseStream = cleanStreamUrl(m.dai_url || m.adfree_url || m.stream_url || "");

            // 1. Check DRM first
            const cdn = m.STREAMING_CDN || {};
            if (cdn.is_drm && cdn.drm && cdn.drm.clearkey) {
                const [kid, key] = cdn.drm.clearkey.split(":");
                const url = cleanStreamUrl(cdn.Primary_Playback_URL || baseStream || "");
                if (url) {
                    return [{ 
                        res: "DRM Stream", 
                        url: "shaka_player.html?mpd=" + encodeURIComponent(url) + "&kid=" + encodeURIComponent(kid) + "&key=" + encodeURIComponent(key), 
                        isDrm: true 
                    }];
                }
            }

            // 2. Check google_m3u8_hex / m3u8_hex AND resolved M3U master playlist
            const hexData = m.google_m3u8_hex || m.m3u8_hex || m.hex || "";
            const hexQualities = hexData ? extractM3u8Qualities(decodeHex(hexData), cleanStreamUrl(m.json_dai_url || baseStream)) : [];
            const m3uQualities = m.master_m3u8 ? extractM3u8Qualities(m.master_m3u8, baseStream) : [];

            const useHexPrimary = hexQualities.length > 0 && isUrlNotExpired(hexQualities[0].url);
            const primaryList = useHexPrimary ? hexQualities : (m3uQualities.length > 0 ? m3uQualities : hexQualities);
            const secondaryList = useHexPrimary ? m3uQualities : hexQualities;

            if (primaryList.length > 0) {
                primaryList.forEach(q => {
                    const alt = secondaryList.find(s => s.res === q.res);
                    if (alt && alt.url !== q.url) q.fallbackUrl = alt.url;
                });
                return primaryList;
            }

            // 3. Fallback to baseStream (dai_url / adfree_url) with standard resolutions
            if (baseStream && baseStream.startsWith("http")) {
                const qualities = [];
                standardRes.forEach(r => {
                    let qUrl = baseStream;
                    if (/(\d+p\d*|\d+)\.m3u8/i.test(qUrl)) {
                        qUrl = qUrl.replace(/(index__|\/)(\d+p\d*|\d+)\.m3u8/i, "$1" + r + ".m3u8");
                    }
                    qualities.push({ res: r, url: qUrl, isHd: parseInt(r) >= 720, targetRes: r });
                });
                return qualities;
            }

            // 4. Check auto_streams
            const autoStreams = m.auto_streams;
            if (autoStreams && autoStreams.length > 0 && autoStreams[0].auto) {
                const qualities = extractM3u8Qualities(autoStreams[0].auto, baseStream);
                if (qualities.length > 0) return qualities;
            }

            const fallbackUrl = cleanStreamUrl(cdn.Primary_Playback_URL || m.stream_url);
            if (fallbackUrl && fallbackUrl.startsWith("http")) {
                return [{ res: "Auto", url: fallbackUrl, isHd: false, targetRes: "Auto" }];
            }
            return [];
        }

        window.openQuality = function(matchId) {
            const m = findMatchById(matchId);
            if (!m) {
                alert("Match details not found.");
                return;
            }
            currentMatch = m;

            // Render sleek segmented Audio Language Selector
            const qLangWrap = document.getElementById("quality-lang-wrapper");
            const qLangList = document.getElementById("quality-lang-list");
            if (qLangWrap && qLangList) {
                const baseId = String(m.match_id || "").split("_")[0].toLowerCase();
                const siblings = allMatches.filter(x => {
                    const xBase = String(x.match_id || "").split("_")[0].toLowerCase();
                    return xBase === baseId && hasStream(x);
                });
                if (siblings.length > 1) {
                    qLangWrap.classList.remove("hidden");
                    qLangList.innerHTML = "";
                    siblings.forEach(sib => {
                        const sLang = sib.language || (String(sib.match_id).includes("_tam") ? "Tamil" : (String(sib.match_id).includes("_hin") ? "Hindi" : "English"));
                        const isCur = String(sib.match_id).toLowerCase() === String(m.match_id).toLowerCase();
                        const sBtn = document.createElement("button");
                        sBtn.type = "button";
                        sBtn.className = isCur
                            ? "py-2 px-3 rounded-lg text-xs font-black bg-red-600 text-white shadow-md transition flex items-center justify-center gap-1.5"
                            : "py-2 px-3 rounded-lg text-xs font-semibold bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center justify-center gap-1.5";
                        sBtn.innerHTML = (isCur ? '<span>🎙️</span> ' : '') + esc(sLang);
                        sBtn.onclick = (e) => {
                            e.stopPropagation();
                            if (!isCur) window.openQuality(sib.match_id);
                        };
                        qLangList.appendChild(sBtn);
                    });
                } else {
                    qLangWrap.classList.add("hidden");
                }
            }

            const qualities = parseQualities(m);
            const list = document.getElementById("quality-list");
            list.innerHTML = "";

            if (qualities.length === 0) { alert("Stream not currently available"); return; }

            let rawTitle = m.title || m.match_name || "Live Match";
            if (m.team_1 && m.team_2) {
                rawTitle = `${m.team_1} vs ${m.team_2}`;
            }
            const cleanTitle = rawTitle.replace(/\s*\[(English|Hindi|Tamil|Kannada|Telugu|Bengali|ENG|HIN|TAM)\]/gi, '').trim();

            document.getElementById("player-title").textContent = cleanTitle;
            document.getElementById("player-event").textContent = m.event_name || m.tournament || m.event_category || m.title || "";

            const btnFull = document.getElementById("btn-full-player");
            if (btnFull) btnFull.href = "player.html?id=" + encodeURIComponent(m.match_id);

            if (qualities.length === 1 && qualities[0].isDrm) {

        function stopPlayer() {
            if (hlsInstance) {

        function launchPlayer(url) {
            const video = document.getElementById("native-video");
            const modal = document.getElementById("player-modal");
            const msg = document.getElementById("player-message");

            stopPlayer();

            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.body.classList.add("modal-open");

            msg.classList.add("hidden");
            msg.textContent = "";

            video.muted = true;

            let started = false;
            const loadTimeout = setTimeout(() => {
                if (!started) {
                    msg.innerHTML = 'Stream taking too long to load. <button onclick="window.retryPlayer()" style="text-decoration:underline;color:#ef4444;font-weight:bold;margin-left:4px;">Tap to Retry</button>';
                    msg.style.display = "flex";
                    msg.classList.remove("hidden");
                }
            }, 12000);

            function playVideo() {
                setTimeout(() => {
                    const p = video.play();
                    if (p !== undefined) {
                        p.then(() => {
                            started = true;
                            clearTimeout(loadTimeout);
                            msg.classList.add("hidden");
                        }).catch(() => {
                            started = true;
                            clearTimeout(loadTimeout);
                            msg.innerHTML = '<div style="cursor:pointer;padding:10px 20px;background:#ef4444;color:#fff;border-radius:8px;font-weight:bold;">▶ Tap to Play Stream</div>';
                            msg.style.display = "flex";
                            msg.classList.remove("hidden");
                            msg.onclick = function() {
                                video.play();
                                msg.classList.add("hidden");
                            };
                        });
                    }
                }, 150);
            }

            const streamSrc = url || selectedRawUrl;
            const reqRes = (currentQuality && currentQuality.res) ? currentQuality.res : "Auto";
            updateModalQualityBadge(reqRes);
            if (currentMatch) renderModalLanguageSelector(currentMatch);
            buildModalQualityMenu();
            // 1. Native HLS playback: runs natively without cross-origin CORS restrictions on all mobile browsers, iOS & Safari
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = streamSrc;
                video.play().catch(() => {});
                video.addEventListener("loadedmetadata", playVideo, { once: true });
                return;
            }

            // 2. HLS.js for browsers without native HLS support (e.g. desktop browsers)
            if (window.Hls && Hls.isSupported()) {
                let triedFallback = false;
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 90,
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    maxBufferSize: 60 * 1000 * 1000,
                    maxBufferHole: 0.5,
                    liveSyncDurationCount: 4,
                    liveMaxLatencyDurationCount: 8,
                    liveDurationInfinity: true,
                    highBufferWatchdogPeriod: 2,
                    fragLoadingTimeOut: 25000,
                    fragLoadingMaxRetry: 6,
                    fragLoadingRetryDelay: 500,
                    xhrSetup: function(xhr) { xhr.withCredentials = false; }
                });
                hlsInstance.loadSource(streamSrc);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    if (hlsInstance.levels && hlsInstance.levels.length > 1 && reqRes !== "Auto") {
                        const targetIdx = findLevelIndex(hlsInstance.levels, reqRes);
                        if (targetIdx !== -1) hlsInstance.currentLevel = targetIdx;
                    }
                    buildModalQualityMenu();
                    playVideo();
                });
                hlsInstance.on(Hls.Events.FRAG_LOADED, function() {
                    started = true;
                    clearTimeout(loadTimeout);
                    msg.classList.add("hidden");
                });
                hlsInstance.on(Hls.Events.ERROR, function(ev, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                if (!triedFallback && currentQuality && currentQuality.fallbackUrl && streamSrc !== currentQuality.fallbackUrl) {
                                    triedFallback = true;
                                    selectedRawUrl = currentQuality.fallbackUrl;
                                    selectedStreamUrl = currentQuality.fallbackUrl;
                                    hlsInstance.loadSource(currentQuality.fallbackUrl);
                                    hlsInstance.startLoad();
                                } else {
                                    hlsInstance.startLoad();
                                }
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                clearTimeout(loadTimeout);
                                msg.innerHTML = 'Stream offline or temporarily unavailable. <button onclick="window.retryPlayer()" style="text-decoration:underline;color:#ef4444;margin-left:4px;">Tap to Retry</button>';
                                msg.style.display = "flex";
                                msg.classList.remove("hidden");
                                stopPlayer();
                                break;
                        }
                    }
                });
                return;
            }

            video.src = streamSrc;
            playVideo();
        }

        function findLevelIndex(levels, targetRes) {
            if (!targetRes || targetRes === "Auto" || targetRes === "auto") return -1;
            const targetH = parseInt(String(targetRes).replace("p", ""));
            if (!targetH || isNaN(targetH)) return -1;
            if (!levels || !levels.length) return -1;

            // Find all matching levels for this height
            const matches = [];
            for (let i = 0; i < levels.length; i++) {
                if (levels[i].height === targetH) {
                    matches.push({ index: i, bitrate: levels[i].bitrate || 0, fps: levels[i].frameRate || 25 });
                }
            }
            if (matches.length > 0) {
                // If multiple 1080p exist (e.g. 25fps vs 50fps), pick stable 25fps stream to prevent network buffer underrun/lag
                matches.sort((a, b) => a.bitrate - b.bitrate);
                return matches[0].index;
            }

            let closest = 0;
            let minDiff = Math.abs((levels[0].height || 0) - targetH);
            for (let i = 1; i < levels.length; i++) {
                const diff = Math.abs((levels[i].height || 0) - targetH);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = i;
                }
            }
            return closest;
        }

        function parseM3uText(text) {
            if (!text) return [];
            const lines = text.split("\n");
            const list = [];
            let cur = null;
            for (let rawLine of lines) {
                const line = rawLine.trim();
                if (line.startsWith("#EXTINF:")) {
                    cur = {};
                    const idMatch = line.match(/tvg-id="([^"]+)"/i);
                    cur.match_id = idMatch ? idMatch[1] : "";
                    const nameMatch = line.match(/tvg-name="([^"]+)"/i);
                    cur.match_name = nameMatch ? nameMatch[1] : "";
                    cur.title = cur.match_name;
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    cur.src = logoMatch ? logoMatch[1] : "";
                    const langMatch = line.match(/tvg-language="([^"]+)"/i);
                    cur.language = langMatch ? langMatch[1] : "English";
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    cur.event_category = groupMatch ? groupMatch[1] : "Sports";
                    cur.event_name = cur.event_category;
                    const commaSplit = line.split(",");
                    if (commaSplit.length > 1 && !cur.title) {
                        cur.title = commaSplit[commaSplit.length - 1].trim();
                        cur.match_name = cur.title;
                    }
                } else if (line.startsWith("http") && cur) {
                    const streamUrl = cleanStreamUrl(line);
                    cur.stream_url = streamUrl;
                    cur.dai_url = streamUrl;
                    cur.adfree_url = streamUrl;
                    cur.status = "LIVE";
                    if (cur.match_id) {
                        const baseId = String(cur.match_id).split("_")[0].toLowerCase();
                        const lang = (cur.language || "English").trim();
                        const langLower = lang.toLowerCase();
                        const langCode = langLower.substring(0, 3);
                        if (langLower !== "english" && !String(cur.match_id).toLowerCase().includes("_")) {
                            cur.match_id = `${baseId}_${langCode}`;
                        }
                        if (!cur.title.toLowerCase().includes(langLower) && !cur.title.toLowerCase().includes(`[${langCode}]`)) {
                            cur.title = `${cur.title} [${lang}]`;
                            cur.match_name = cur.title;
                        }
                        list.push(cur);
                    }
                    cur = null;
                }
            }
            return list;
        }

        async function fetchM3uMatches() {
            const m3uMap = new Map();
            const urls = [
                M3U_API + "?t=" + Date.now(),
                "./data/fancode.m3u?t=" + Date.now(),
                BACKUP_M3U_API + "?t=" + Date.now()
            ];

            await Promise.allSettled(urls.map(async (u) => {
                try {
                    const r = await fetch(u, { cache: "no-store" });
                    if (!r.ok) return;
                    const text = await r.text();
                    const parsed = parseM3uText(text);
                    parsed.forEach(m => {
                        const uniqueId = String(m.match_id || "").toLowerCase();
                        if (!m3uMap.has(uniqueId)) {
                            m3uMap.set(uniqueId, m);
                        } else {
                            const ex = m3uMap.get(uniqueId);
                            if (!ex.stream_url && m.stream_url) {
                                m3uMap.set(uniqueId, m);
                            }
                        }
                    });
                } catch (_) {}
            }));

            const list = Array.from(m3uMap.values());
            await Promise.allSettled(list.map(async (item) => {
                if (item.stream_url && item.stream_url.includes(".m3u8")) {
                    try {
                        const r = await fetch(cleanStreamUrl(item.stream_url), { cache: "no-store" });
                        if (r.ok) {
                            const mText = await r.text();
                            if (mText && mText.includes("#EXT-X-STREAM-INF")) {
                                item.master_m3u8 = mText;
                            }
                        }
                    } catch (_) {}
                }
            }));
            return list;
        }

        async function fetchJsonMatches() {
            const jsonMap = new Map();
            const urls = [
                JSON_API + "?t=" + Date.now(),
                "./data/fancode.json?t=" + Date.now(),
                BACKUP_JSON_API + "?t=" + Date.now()
            ];

            await Promise.allSettled(urls.map(async (u) => {
                try {
                    const r = await fetch(u, { cache: "no-store" });
                    if (!r.ok) return;
                    const data = await r.json();
                    const matches = data.matches || (Array.isArray(data) ? data : []);
                    matches.forEach(jm => {
                        const uniqueId = String(jm.match_id || "").toLowerCase();
                        if (!jsonMap.has(uniqueId)) {
                            jsonMap.set(uniqueId, jm);
                        } else {
                            const ex = jsonMap.get(uniqueId);
                            if ((!ex.dai_url && !ex.stream_url) && (jm.dai_url || jm.stream_url || jm.adfree_url)) {
                                jsonMap.set(uniqueId, Object.assign({}, ex, jm));
                            }
                        }
                    });
                } catch (_) {}
            }));

            return Array.from(jsonMap.values());
        }

        async function fetchAllMatches() {
            const [m3uResult, jsonResult] = await Promise.allSettled([
                fetchM3uMatches(),
                fetchJsonMatches()
            ]);
            const m3uMatches = m3uResult.status === "fulfilled" ? m3uResult.value : [];
            const jsonMatches = jsonResult.status === "fulfilled" ? jsonResult.value : [];

            const combinedMap = new Map();

            m3uMatches.forEach(m => {
                const uniqueId = String(m.match_id).toLowerCase();
                combinedMap.set(uniqueId, m);
            });

            for (const jm of jsonMatches) {
                const rawId = String(jm.match_id || "").toLowerCase();
                const baseId = rawId.split("_")[0];
                const targetKey = combinedMap.has(rawId) ? rawId : (combinedMap.has(baseId) ? baseId : rawId);

                if (combinedMap.has(targetKey)) {
                    const existing = combinedMap.get(targetKey);
                    if (!existing.startTime && jm.startTime) existing.startTime = jm.startTime;
                    if (!existing.team_1 && jm.team_1) existing.team_1 = jm.team_1;
                    if (!existing.team_2 && jm.team_2) existing.team_2 = jm.team_2;
                    if (!existing.event_name && (jm.event_name || jm.tournament)) existing.event_name = jm.event_name || jm.tournament;
                    if (jm.STREAMING_CDN && !existing.STREAMING_CDN) existing.STREAMING_CDN = jm.STREAMING_CDN;
                    if (jm.google_m3u8_hex && !existing.google_m3u8_hex) existing.google_m3u8_hex = jm.google_m3u8_hex;
                    if ((jm.dai_url || jm.adfree_url) && !existing.json_dai_url) existing.json_dai_url = jm.dai_url || jm.adfree_url;
                    if (!existing.src && jm.src) existing.src = jm.src;
                    existing.status = "LIVE";
                } else {
                    combinedMap.set(targetKey, jm);
                }
            }

            combinedMap.forEach((m, key) => {
                const baseId = String(m.match_id).split("_")[0].toLowerCase();
                if (key !== baseId && combinedMap.has(baseId)) {
                    const parent = combinedMap.get(baseId);
                    if (!m.src && parent.src) m.src = parent.src;
                    if (!parent.src && m.src) parent.src = m.src;
                    if (!m.startTime && parent.startTime) m.startTime = parent.startTime;
                    if (!parent.startTime && m.startTime) parent.startTime = m.startTime;
                    if (!m.team_1 && parent.team_1) m.team_1 = parent.team_1;
                    if (!parent.team_1 && m.team_1) parent.team_1 = parent.team_1;
                    if (!m.team_2 && parent.team_2) m.team_2 = parent.team_2;
                    if (!parent.team_2 && m.team_2) parent.team_2 = parent.team_2;
                    if (!m.event_name && parent.event_name) m.event_name = parent.event_name;
                    if (!parent.event_name && m.event_name) parent.event_name = m.event_name;
                    if (parent.event_category && parent.event_category !== "Cricket") m.event_category = parent.event_category;
                    if (m.event_category && m.event_category !== "Cricket" && (!parent.event_category || parent.event_category === "Cricket")) parent.event_category = m.event_category;
                }
            });

            return Array.from(combinedMap.values());
        }

        async function loadData() {
            try {
                const matches = await fetchAllMatches();
                document.getElementById("loader").style.display = "none";
                allMatches = dedup(matches);
                const lc = allMatches.filter(m => (m.status||"").toUpperCase() === "LIVE" && hasStream(m)).length;
                document.getElementById("live-count").textContent = lc;
                buildFilters(allMatches);
                render("ALL");
                checkDeepLink();
            } catch (err) {
                document.getElementById("loader").innerHTML = '<p class="text-red-500 font-semibold">Failed to load matches. Please refresh to retry.</p>';
            }
        }

        loadData();

        // Auto-refresh matches every 60s to keep upcoming & live matches updated seamlessly
        setInterval(async () => {
            try {
                const matches = await fetchAllMatches();
                allMatches = dedup(matches);
                const lc = allMatches.filter(m => (m.status||"").toUpperCase() === "LIVE" && hasStream(m)).length;
                document.getElementById("live-count").textContent = lc;
                render(currentFilter);
            } catch (e) {}
        }, 60 * 1000);
    })();
    </script>
